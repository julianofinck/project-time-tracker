[project]
name = "project-time-tracker"
version = "0.1.0"
description = "This app generates dynamic graphs to analyse a company. It assumes the company members daily report the hours invested in each project, product and task."
authors = [
  { name = "Juliano Santos Finck", email = "59181757+julianofinck@users.noreply.github.com" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
  "python-dotenv>=1.0.1",
  "dash>=2.17.1",
  "numpy>=2.0.1",
  "pandas>=2.2.2",
  "openpyxl>=3.1.5",
  "office365>=0.3.15",
  "office365-rest-python-client>=2.5.14",
  "dash-ag-grid>=31.3.1",
  "gunicorn>=23.0.0",
  "pre-commit>=4.2.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "ruff>=0.12.5",
]

